<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      
      .bg-canvas { fill: #FFFFFF; }
      .box { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1.5; rx: 8px; }
      .box-relay { fill: #F8FAFC; stroke: #0F172A; stroke-width: 1.5; rx: 10px; }
      .box-module { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; rx: 6px; }
      .box-upstream { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; rx: 8px; }
      
      .text-title { fill: #0F172A; font-weight: 600; }
      .text-body { fill: #334155; }
      .text-muted { fill: #64748B; }
      .text-code { fill: #475569; font-family: ui-monospace, SFMono-Regular, monospace; }
      
      .arrow { stroke: #0F172A; stroke-width: 1.5; fill: none; }
      .arrow-dashed { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .arrow-head { fill: #0F172A; }
      .arrow-head-gray { fill: #94A3B8; }
      
      .badge { fill: #EEF2FF; stroke: #6366F1; stroke-width: 1; rx: 4px; }
    </style>
    
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arrow-head-gray" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" class="bg-canvas" />

  <!-- ================= 1. CLIENT LAYER ================= -->
  <!-- Local Stdio Clients -->
  <g transform="translate(60, 40)">
    <rect width="360" height="68" class="box" />
    <text x="20" y="30" class="font-main text-title" font-size="14">Local MCP Clients</text>
    <text x="20" y="50" class="font-main text-muted" font-size="12">Claude Desktop · Antigravity · Codex · Cursor</text>
  </g>

  <!-- Native Remote Clients -->
  <g transform="translate(540, 40)">
    <rect width="360" height="68" class="box" />
    <text x="20" y="30" class="font-main text-title" font-size="14">Native Remote Clients</text>
    <text x="20" y="50" class="font-main text-muted" font-size="12">Direct HTTP &amp; OAuth support (e.g. WorkBuddy)</text>
  </g>

  <!-- Arrow: Local Clients -> Relay -->
  <path d="M 240 108 L 240 160" class="arrow" marker-end="url(#arr)" />
  <text x="250" y="138" class="font-mono text-muted" font-size="11">stdio (JSON-RPC)</text>

  <!-- Arrow: Native Clients -> Upstream -->
  <path d="M 720 108 L 720 340" class="arrow-dashed" marker-end="url(#arr-gray)" />
  <rect x="665" y="215" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <text x="720" y="230" text-anchor="middle" class="font-mono text-muted" font-size="10">Direct Connect</text>

  <!-- ================= 2. LOCAL RELAY CORE ================= -->
  <g transform="translate(60, 160)">
    <!-- Container -->
    <rect width="460" height="150" class="box-relay" />
    <text x="20" y="28" class="font-main text-title" font-size="13">@ethanli666/qqmail-mcp</text>
    <text x="180" y="28" class="font-mono text-muted" font-size="11">(Local Relay Core)</text>

    <!-- Sub-module: Protocol Adapter -->
    <g transform="translate(20, 44)">
      <rect width="420" height="26" class="box-module" />
      <text x="12" y="17" class="font-main text-title" font-size="11">Protocol Adapter</text>
      <text x="135" y="17" class="font-mono text-muted" font-size="10">2024-11-05 / 2025-11-25 ↔ 2025-03-26</text>
    </g>

    <!-- Sub-module: Write Confirmation -->
    <g transform="translate(20, 76)">
      <rect width="420" height="26" class="box-module" />
      <text x="12" y="17" class="font-main text-title" font-size="11">Write Confirmation</text>
      <text x="135" y="17" class="font-mono text-muted" font-size="10">Tencent 42801 Challenge ↔ Elicitation Modal</text>
    </g>

    <!-- Sub-module: Upstream Supervisor -->
    <g transform="translate(20, 108)">
      <rect width="420" height="26" class="box-module" />
      <text x="12" y="17" class="font-main text-title" font-size="11">Upstream Supervisor</text>
      <text x="135" y="17" class="font-mono text-muted" font-size="10">Fallback: Codex → Claude → WorkBuddy</text>
    </g>
  </g>

  <!-- Arrow: Relay -> Upstream -->
  <path d="M 290 310 L 290 340" class="arrow" marker-end="url(#arr)" />
  <text x="300" y="330" class="font-mono text-muted" font-size="11">mcp-remote (Streamable HTTP)</text>

  <!-- ================= 3. TENCENT OFFICIAL MCP ================= -->
  <g transform="translate(60, 340)">
    <rect width="840" height="80" class="box-upstream" />
    
    <text x="24" y="32" class="font-main text-title" font-size="14" fill="#15803D">Tencent Official QQ Mail MCP Service</text>
    <text x="24" y="52" class="font-mono text-code" font-size="11">https://api.mail.qq.com/mcp</text>
    
    <!-- Badges / Features -->
    <g transform="translate(480, 20)">
      <text x="0" y="16" class="font-main text-body" font-size="12">• OAuth 2.0 (Zero local plaintext password)</text>
      <text x="0" y="38" class="font-main text-body" font-size="12">• Official 12 Tools (ListMessages, SendMessage, Delete...)</text>
    </g>
  </g>
</svg>
